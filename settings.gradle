rootProject.name = 'merlin-to-hec'

include ":merlin-data-exchange"

dependencyResolutionManagement {

    // set this so the repositories listed here are preferred
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {

        mavenCentral()

        // Route only gov.usbr.wq artifacts to GitHub Packages
        exclusiveContent {
            forRepositories (
                mavenLocal(),
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/doi-bor/Merlin-Web-Client')
                    credentials {
                        username = System.getenv("GITHUB_ACTOR")
                        password = System.getenv("GITHUB_TOKEN")
                    }
                }
            )
            filter { includeGroup('gov.usbr.wq') }
        }

        // Route HEC/Nexus artifacts to HEC’s public repository
        exclusiveContent {
            forRepository {
                maven {
                    name = 'HEC_Nexus'
                    url = uri('https://www.hec.usace.army.mil/nexus/repository/maven-public')
                }
            }
            filter {
                includeGroup('mil.army.usace.hec')
                includeGroup('com.rmanet')
            }
        }
        // New GitLab mirror repo
        maven {
            name = 'GitLabMirror'
            url = uri('https://gitlab.bor.doi.net/api/v4/projects/992/packages/maven')
            credentials(PasswordCredentials) {
                username = System.getenv("GITLAB_USER")
                password  = System.getenv("GITLAB_TOKEN")
            }
            authentication {
                header(BasicAuthentication)
            }
        }
    }
}
